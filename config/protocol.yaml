# auto_serial_bridge 协议配置。修改后需重新 colcon build 才会生效。
#
# 系统消息 Ack(0xFD)、Heartbeat(0xFE)、Handshake(0xFF) 由框架内置，
# 不需要也不允许写在这里；messages 里只写你自己的业务消息。

serial_controller:
  ros__parameters:
    port: "/dev/ttyACM0"        # 串口设备路径，可用 launch 参数 port:= 覆盖
    baudrate: 115200            # 波特率，可用 launch 参数 baudrate:= 覆盖
    debug_raw_frame: false      # 配合 debug 日志输出原始收发帧

config:
  buffer_size: 1024             # 接收缓冲区，须能容纳最大完整帧
  head_byte_1: 0x5A             # 帧头字节，两端必须一致
  head_byte_2: 0xA5
  checksum: "CRC8"              # NONE / SUM8 / XOR8 / CRC8
  require_handshake: true       # 打开串口后先校验协议哈希
  ignore_version_mismatch: false
  strict_heartbeat: true        # 心跳超时断开并自动重连（心跳始终开启）
  heartbeat_interval_ms: 1000   # 心跳发送间隔，由 ROS 端周期发起
  heartbeat_timeout_ms: 3000    # 心跳确认超时，须 >= heartbeat_interval_ms
  reliable_retry_interval_ms: 100
  reliable_max_retries: 3
  qos_depth: 10

# 字段类型别名 -> 定长 C 类型。支持 uint8_t/uint16_t/uint32_t/int32_t/float。
type_mappings:
  f32: "float"
  i32: "int32_t"
  u8: "uint8_t"
  u16: "uint16_t"
  u32: "uint32_t"

# 业务消息列表。字段说明：
#   name       消息名（合法 C 标识符，生成 Packet_<name>）
#   id         0x00-0xFC 唯一消息 ID（0xFD-0xFF 为框架保留）
#   direction  tx = ROS->MCU，rx = MCU->ROS，both = 双向
#   reliable   true 时启用 ACK + 超时重传（仅支持 tx）
#   sub_topic / pub_topic  对应方向的 ROS 话题（相对话题，不带前导 /）
#   ros_msg    ROS 消息类型，形如 package/msg/Type
#   fields     按线协议顺序：{ proto: 协议字段名, type: 类型, ros: ROS 字段路径 }
#
# 下面是三条示例，替换成你自己的消息即可：
messages: []

# messages:
#   - name: "DemoCommand"
#     id: 0x01
#     direction: "tx"
#     sub_topic: "demo/command"
#     ros_msg: "std_msgs/msg/UInt32"
#     fields:
#       - { proto: "value", type: "u32", ros: "data" }
#
#   - name: "DemoReliableCommand"
#     id: 0x02
#     direction: "tx"
#     reliable: true
#     sub_topic: "demo/reliable_command"
#     ros_msg: "std_msgs/msg/UInt32"
#     fields:
#       - { proto: "value", type: "u32", ros: "data" }
#
#   - name: "DemoTelemetry"
#     id: 0x03
#     direction: "rx"
#     pub_topic: "demo/telemetry"
#     ros_msg: "std_msgs/msg/Float32"
#     fields:
#       - { proto: "value", type: "f32", ros: "data" }
