# 0. ROS2 参数配置 
serial_controller:
  ros__parameters:
    port: "/dev/stm32"
    baudrate: &baudrate 115200
    timeout: 0.1

# 1. 全局配置
config:
  baudrate: *baudrate
  buffer_size: 256
  head_byte_1: 0x5A      # 双帧头 1
  head_byte_2: 0xA5      # 双帧头 2
  checksum: "CRC8"       # 校验算法

# 2. 类型映射
type_mappings:
  f32: "float"
  i32: "int32_t"
  u8:  "uint8_t"
  u16: "uint16_t"
  u32: "uint32_t"

messages:

  # 3.0 系统消息
  - name: "Heartbeat"
    id: 0x00
    direction: "both"
    sub_topic: "/task/heartbeat"
    pub_topic: "/task/heartbeat"
    ros_msg: "std_msgs/msg/UInt32"
    notes: "握手完成后，电控应以固定周期（建议 100ms）持续发送心跳，ROS 侧也会同频回应。count 字段单调递增，从 0 开始。"
    fields:
      - { proto: "count", type: "u32", ros: "data" }

  - name: "Handshake"
    id: 0xFF
    direction: "both"
    sub_topic: "/task/handshake"
    pub_topic: "/task/handshake"
    ros_msg: "std_msgs/msg/UInt32"
    notes: "上电后 ROS 主动发起握手，电控收到后用相同的 protocol_hash 原样回复。握手通过后方可发送其他数据帧，且整个连接周期内只需执行一次。protocol_hash 值见【全局参数】。"
    fields:
      - { proto: "protocol_hash", type: "u32", ros: "data" }


  # 底盘移动控制
  - name: "CmdVel"
    id: 0x01
    direction: "tx"
    sub_topic: "/cmd_vel"
    ros_msg: "geometry_msgs/msg/Twist"
    fields:
      - { proto: "linear_x",  type: "f32", ros: "linear.x" }
      - { proto: "linear_y",  type: "f32", ros: "linear.y" }
      - { proto: "angular_z", type: "f32", ros: "angular.z" }

  # 状态转换控制
  - name: "GenericStatus"
    id: 0x19
    direction: "both"
    sub_topic: "/task/generic_status"
    pub_topic: "/task/generic_status"
    ros_msg: "std_msgs/msg/Float32MultiArray"
    fields:
      - { proto: "task_index", type: "f32", ros: "data[0]" }
      - { proto: "tx_id",      type: "f32", ros: "data[1]" }
      - { proto: "tx_status",  type: "f32", ros: "data[2]" }
      - { proto: "rx_id",      type: "f32", ros: "data[3]" }
      - { proto: "rx_status",  type: "f32", ros: "data[4]" }

  # 2.2 武器对接反馈
  - name: "WeaponDockFeedback"
    id: 0x02
    direction: "tx"
    sub_topic: "/task/weapon_docking/_public_feedback"
    ros_msg: "geometry_msgs/msg/Vector3"
    fields:
      - { proto: "x_error",     type: "f32", ros: "x" }
      - { proto: "y_error",     type: "f32", ros: "y" }
      - { proto: "pitch_error", type: "f32", ros: "z" }

  # 2.3 上/下台阶定位
  - name: "StairPoseGoal"
    id: 0x03
    direction: "tx"
    sub_topic: "/perception/stair_pose/_public_goal"
    ros_msg: "geometry_msgs/msg/Vector3"
    fields:
      - { proto: "target_dist", type: "f32", ros: "x" }
      - { proto: "yaw",         type: "f32", ros: "y" }

  - name: "StairType"
    id: 0x04
    direction: "tx"
    sub_topic: "/perception/stair_type"
    ros_msg: "std_msgs/msg/Int32"
    fields:
      - { proto: "task_type",   type: "i32", ros: "data" } 

  # 2.4 梅林抓取 KFS
  - name: "MerlinPickGoal"
    id: 0x05
    direction: "tx"
    sub_topic: "/task/merlin_pick/_public_goal"
    ros_msg: "geometry_msgs/msg/Pose"
    fields:
      - { proto: "x",   type: "f32", ros: "position.x" }
      - { proto: "y",   type: "f32", ros: "position.y" }
      - { proto: "z",   type: "f32", ros: "position.z" }
      - { proto: "yaw", type: "f32", ros: "orientation.z" }
